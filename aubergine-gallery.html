<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aubergine Restaurant – Gallery</title>

<style>
/* ---------- COLOURS (change here) ---------- */
:root{
  --cream:#f6e6d3;   /* page background */
  --paper:#fff9f1;   /* card background */
  --ink:#2b1d1a;     /* text + card borders */
  --red:#c8161d;
  --green:#35a846;
  --mut:#6b5a52;     /* grey-brown small text */
  --card-w:240px;    /* card width */
  --photo-h:270px;   /* photo height */
  --gap:22px;        /* space between cards */
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:70px;scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Georgia,'Times New Roman',serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--cream);z-index:30}

/* ---------- TOP BAR ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--cream);border-bottom:3px solid var(--green);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 20px;overflow-x:auto;white-space:nowrap}
.logo{font-size:1.5rem;color:#4a1d5c}
.logo small{font:.55rem Arial,sans-serif;color:var(--green);letter-spacing:.3em;text-transform:uppercase;margin-left:6px}
.top nav{display:flex;gap:18px}
.top a{color:var(--ink);text-decoration:none;font:bold .78rem Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;border-bottom:2px solid transparent;padding-bottom:3px}
.top a:hover{color:var(--red);border-color:var(--red)}

/* ---------- HERO ---------- */
.hero{max-width:1100px;margin:0 auto;padding:54px 20px 10px}
.hero p{margin:0 0 6px;font:bold .8rem Arial,sans-serif;letter-spacing:.25em;text-transform:uppercase;color:var(--red)}
.hero h1{margin:0;font-size:clamp(2.6rem,9vw,5.6rem);line-height:.95;font-weight:normal}
.hero h1 em{color:var(--red)}

/* ---------- SECTION HEADINGS ---------- */
section{padding:46px 0 8px}
.h{max-width:1100px;margin:0 auto 20px;padding:0 20px 10px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.h i{font:bold .9rem Arial,sans-serif;color:var(--red)}
.h h2{margin:0;font-size:2rem;font-weight:normal}
.h p{margin:0 0 0 auto;font-style:italic;color:var(--mut);font-size:.95rem}

/* ---------- ROW OF CARDS (no auto-scroll: swipe or drag sideways) ---------- */
.row{overflow-x:auto;overflow-y:hidden;padding:6px 0 14px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--green) transparent}
.track{display:flex;width:max-content}
.set{display:flex;padding-left:var(--gap);padding-right:var(--gap)}   /* space before the first and after the last card */
.set .c:last-child{margin-right:0}

/* ---------- CARD ---------- */
.c{margin:0 var(--gap) 0 0;width:var(--card-w);flex:none;background:var(--paper);border-radius:2px;overflow:hidden}
.ph{height:var(--photo-h);display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.slot{background:repeating-linear-gradient(135deg,#f3e2cf 0 10px,#f8ecdd 10px 20px)}
.slot span{font:bold .72rem Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#a58369}
figcaption{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;padding:12px 14px 14px;align-items:baseline}
figcaption b{font:bold .8rem Arial,sans-serif;color:var(--red)}
figcaption span{font-size:1.15rem}
figcaption em{grid-column:2;font:.8rem Arial,sans-serif;color:var(--mut)}

footer{margin-top:50px;background:var(--green);color:#fff;text-align:center;padding:22px 16px;font:.85rem Arial,sans-serif;letter-spacing:.04em}

@media(max-width:600px){:root{--card-w:210px;--photo-h:240px}.h p{margin-left:0;width:100%}}
</style>
</head>
<body>

<!-- ================= TOP BAR ================= -->
<header class="top">
  <div class="logo">aubergine<small>Restaurant</small></div>
  <nav><a href="#vibe">Vibe</a><a href="#cocktails">Cocktails</a><a href="#food">Foods &amp; Drinks</a><a href="#pizza">Pizza</a></nav>

<!-- ================= SCRIPT (no need to edit) =================
  If a photo file is missing, shows the "Photo slot" box instead -->
<script>
function slot(img){var p=img.parentNode;p.classList.add('slot');p.innerHTML='<span>Photo slot</span>';}
document.querySelectorAll('.ph img').forEach(function(img){
  img.addEventListener('error',function(){slot(img)});
  if(img.complete&&!img.naturalWidth)slot(img);
});
</script>
</body>
